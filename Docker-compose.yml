services:
  file_vault_db:
    image: "postgres"
    container_name: "file_vault_db"
    environment:
      - POSTGRES_USER=file_vault
      - POSTGRES_PASSWORD=file_vault123
      - POSTGRES_DB=file_vault_database
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data