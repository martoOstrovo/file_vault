<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">
<!--marto : Marto123!@#-->

<nav class="bg-white border-b border-gray-200 px-6 py-4">
    <div class="flex space-x-6">
        <a th:href="@{/home}" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Home</a>
        <a th:href="@{/register}" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Register</a>
    </div>
</nav>

<div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
            <h1 class="text-2xl font-semibold text-gray-900 text-center mb-8">Login to your account</h1>

            <form action="#" th:action="@{/login}" method="POST" class="space-y-6">

                <div th:if="${param.error}" class="bg-red-50 border border-red-200 rounded-md p-3">
                    <p class="text-red-800 text-sm">Invalid user credentials</p>
                </div>

                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                    <input type="text" id="username" name="username"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-gray-500">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" name="password"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-gray-500">
                </div>

                <button type="submit"
                        class="w-full bg-gray-900 text-white py-2 px-4 rounded-md hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors font-medium">
                    Sign in
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
