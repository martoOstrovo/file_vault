<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th = "http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
</head>
<body>
<h1>Welcome <span th:text="${user.getUsername()}"></span></h1>

<form th:action="@{/logout}" method="post">
    <input type="submit" value="Logout">
</form>

<br>

<span th:if="error != null" th:text="${error}"></span>

<table th:if="${!ownedFiles.isEmpty()}">
    <thead>
    <tr>
        <th>Owned files:</th>
<!--        <th>Action</th>-->
    </tr>
    </thead>

    <tbody>
    <tr th:each="file : ${ownedFiles}">
        <td th:text="${file.getFileName()}"></td>
        <td>
            <form method="GET" th:action="@{'/manage-file/{fileID}' (fileID = ${file.getId()})}">
                <input type="submit" value="manage">
            </form>
        </td>
    </tr>
    </tbody>
</table>

<table th:if="${!accessibleFiles.isEmpty()}">
    <thead>
    <tr>
        <th>Accessible files:</th>
        <!--        <th>Action</th>-->
    </tr>
    </thead>

    <tbody>
    <tr th:each="file : ${accessibleFiles}">
        <td th:text="${file.getFileName()}"></td>
        <td>
            <form method="GET" th:action="@{'/manage-file/{fileID}' (fileID = ${file.getId()})}">
                <input type="submit" value="manage">
            </form>
        </td>
    </tr>
    </tbody>
</table>

<p>
    Upload a file : <a th:href="@{file-upload}"> upload </a>
</p>
</body>
</html>
