<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
<div class="max-w-md mx-auto">

    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">File Upload</h1>
        <p class="text-gray-600">Select a file to upload to the system</p>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
        <form method="POST" th:action="@{/file-upload}" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label for="file" class="block text-sm font-medium text-gray-700 mb-2">
                    Choose a file
                </label>
                <div class="relative">
                    <input
                            type="file"
                            name="file"
                            id="file"
                            class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-gray-50 file:text-gray-700 hover:file:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2"
                            required
                    >
                </div>
            </div>

            <div>
                <label for="fileName" class="block text-sm font-medium text-gray-700 mb-2">
                    File name
                </label>
                <input
                        type="text"
                        name="fileName"
                        id="fileName"
                        placeholder="Original name will be kept if empty"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-gray-500"
                >
                <p class="mt-1 text-xs text-gray-500">Leave empty to keep the original filename</p>
            </div>

            <div class="pt-4">
                <button
                        type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-colors duration-200"
                >
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    Upload File
                </button>
            </div>
        </form>
    </div>

    <div class="mt-6 text-center">
        <p class="text-xs text-gray-500">
            Supported file types: All formats accepted
        </p>
    </div>
</div>
</body>
</html>
